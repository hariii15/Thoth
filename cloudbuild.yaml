steps:
  # Step 1: Build the container image using Google Cloud Buildpacks
  - name: 'gcr.io/k8s-skaffold/pack'
    args:
      - 'build'
      - '--builder=gcr.io/buildpacks/builder:latest'
      - '--path=.'
      - '--tag=asia-south2-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/thoth:$SHORT_SHA'
    id: 'Build'

  # Step 2: Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south2-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/thoth:$SHORT_SHA'
    id: 'Push'

  # Step 3: Deploy the container image to Cloud Run
  - name: 'gcr.io/google-appengine/exec-wrapper'
    args:
      - '-i'
      - 'asia-south2-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/thoth:$SHORT_SHA'
      - '-s'
      - '${_SERVICE_NAME}:${_TAG_NAME}' # e.g., 'thoth:latest'
      - '--'
      - 'gcloud'
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}' # The name of your Cloud Run service
      - '--platform=managed'
      - '--image=asia-south2-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/thoth:$SHORT_SHA'
      - '--region=asia-south2' # Your Cloud Run region
      - '--allow-unauthenticated' # Use if your service is public
      - '--project=${PROJECT_ID}'
    id: 'Deploy'

# Store the image in Artifact Registry
images:
  - 'asia-south2-docker.pkg.dev/thoth-466511/cloud-run-source-deploy/thoth/thoth:fc5c5ae2667515231c63cb7e2ec9c0e248e61669'

# Define substitutions for variables
substitutions:
  _SERVICE_NAME: 'thoth'
  _TAG_NAME: 'latest'

options:
  logging: CLOUD_LOGGING_ONLY