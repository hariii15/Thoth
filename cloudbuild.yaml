steps:
  # Step 1: Build the container image using Google Cloud Buildpacks
  - name: 'gcr.io/k8s-skaffold/pack'
    args:
      - 'build'
      # Image path with your specific Project ID. The $SHORT_SHA must remain a variable.
      - 'asia-south2-docker.pkg.dev/thoth-466511/cloud-run-source-deploy/thoth:$SHORT_SHA'
      - '--builder=gcr.io/buildpacks/builder:latest'
      - '--path=.'
    id: 'Build'

  # Step 2: Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south2-docker.pkg.dev/thoth-466511/cloud-run-source-deploy/thoth:$SHORT_SHA'
    id: 'Push'

  # Step 3: Deploy the container image to Cloud Run
  - name: 'gcr.io/google-appengine/exec-wrapper'
    args:
      - '-i'
      - 'asia-south2-docker.pkg.dev/thoth-466511/cloud-run-source-deploy/thoth:$SHORT_SHA'
      - '-s'
      - 'thoth:latest' # Hardcoded service name and tag
      - '--'
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'thoth' # Hardcoded service name
      - '--platform=managed'
      - '--image=asia-south2-docker.pkg.dev/thoth-466511/cloud-run-source-deploy/thoth:$SHORT_SHA'
      - '--region=asia-south2'
      - '--allow-unauthenticated'
      - '--project=thoth-466511' # Hardcoded project ID
    id: 'Deploy'

# Store the image in Artifact Registry
images:
  - 'asia-south2-docker.pkg.dev/thoth-466511/cloud-run-source-deploy/thoth:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
